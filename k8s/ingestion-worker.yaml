# =============================================================================
# Karsa Data Ingestion Worker — Kubernetes Deployment
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: karsa
  labels:
    app.kubernetes.io/part-of: karsa
---
apiVersion: v1
kind: Secret
metadata:
  name: karsa-ingestion-secrets
  namespace: karsa
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/part-of: karsa
type: Opaque
stringData:
  # These must be replaced with actual values or managed via external-secrets-operator
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATA_BRIDGE_MASTER_KEY: "CHANGE_ME"
  POLYGON_API_KEY: "CHANGE_ME"
  FINNHUB_API_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestion-worker-config
  namespace: karsa
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/part-of: karsa
data:
  POSTGRES_HOST: "postgres.karsa.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "karsa_db"
  POSTGRES_USER: "karsa"
  DURABLE_BUFFER_PATH: "/data/karsa/bar_buffer.db"
  HEALTH_PORT: "8080"
  LOG_LEVEL: "INFO"
  # Polygon connector config
  TICK_QUEUE_SIZE: "50000"
  MESSAGE_TIMEOUT_SECONDS: "60"
  # Finnhub connector config
  POLL_INTERVAL_SECONDS: "60"
  HEALTH_CACHE_TTL_SECONDS: "300"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  namespace: karsa
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/part-of: karsa
    app.kubernetes.io/component: data-pipeline
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0       # Zero-downtime: old pod drains before new pod starts
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-worker
        app.kubernetes.io/part-of: karsa
        app.kubernetes.io/component: data-pipeline
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 60    # Allow 60s for WebSocket drain + buffer flush
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ingestion-worker
          image: karsa/ingestion-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "karsa.data_bridge.worker"]
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingestion-worker-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: karsa-ingestion-secrets
                  key: POSTGRES_PASSWORD
            - name: DATA_BRIDGE_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karsa-ingestion-secrets
                  key: DATA_BRIDGE_MASTER_KEY
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          # Liveness: is the process alive and responsive?
          # Restarts the pod if the event loop is stuck or the process is deadlocked.
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness: is the worker ready to receive work?
          # Only marks pod ready when WebSockets are connected and buffer is accessible.
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Startup: give the worker time to boot, connect WebSockets, replay buffer.
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12    # 12 * 5s = 60s max startup time
          volumeMounts:
            - name: durable-buffer
              mountPath: /data/karsa
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: durable-buffer
          emptyDir:
            sizeLimit: 1Gi
      # Anti-affinity: don't co-locate with other ingestion workers (if scaled)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - ingestion-worker
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-worker
  namespace: karsa
  labels:
    app.kubernetes.io/name: ingestion-worker
    app.kubernetes.io/part-of: karsa
spec:
  selector:
    app.kubernetes.io/name: ingestion-worker
  ports:
    - name: health
      port: 8080
      targetPort: health
      protocol: TCP
  type: ClusterIP
