[project]
name = "karsa"
version = "0.1.0"
description = "Karsa MVP: A lightweight orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "google-genai>=2.8.0",
    "jsonschema>=4.26.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "psycopg[pool]>=3.3.4",
    "psycopg-binary>=3.3.4",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "alembic>=1.18.4",
    "uvicorn>=0.49.0",
]

[project.scripts]
karsa = "karsa.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "testcontainers>=4.14.2",
]
