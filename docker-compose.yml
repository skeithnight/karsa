version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: karsa
      POSTGRES_PASSWORD: karsa_password
      POSTGRES_DB: karsa_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karsa -d karsa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  karsa-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: "postgresql://karsa:karsa_password@postgres:5432/karsa_db"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "karsa_db"
      POSTGRES_USER: "karsa"
      POSTGRES_PASSWORD: "karsa_password"
      MINIO_URL: "http://minio:9000"
    restart: always

  karsa-web:
    build:
      context: ./karsa-web
      dockerfile: Dockerfile
    depends_on:
      - karsa-api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://karsa-api:8000"
    restart: always

  karsa-projection-worker:
    build: .
    command: ["uv", "run", "python", "src/karsa/projection_worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URL: "postgresql://karsa:karsa_password@postgres:5432/karsa_db"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "karsa_db"
      POSTGRES_USER: "karsa"
      POSTGRES_PASSWORD: "karsa_password"
    restart: always
